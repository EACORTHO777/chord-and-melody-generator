<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chord and Melody Generator</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
  </head>
  <body>
    <main>
      <h1>Chord and Melody Generator</h1>

      <section>
        <label>
          Root note
          <select id="root-note">
            <option>C</option>
            <option>C#</option>
            <option>D</option>
            <option>D#</option>
            <option>E</option>
            <option>F</option>
            <option>F#</option>
            <option>G</option>
            <option>G#</option>
            <option>A</option>
            <option>A#</option>
            <option>B</option>
          </select>
        </label>
        <label>
          Scale
          <select id="scale-type">
            <option value="major">Major</option>
            <option value="minor">Minor</option>
          </select>
        </label>
      </section>

      <section>
        <button id="generate-button">Generate</button>
        <button id="play-button" disabled>Play</button>
        <button id="share-button" disabled>Share</button>
        <button id="save-favorite-button" disabled>Save favorite</button>
        <p id="share-output"></p>
      </section>
      <section>
        <h2>Key</h2>
        <p id="relative-key-output"></p>
        <div id="scale-notes-output"></div>
      </section>

      <section>
        <h2>Chords</h2>
        <div id="chords-output">Press Generate to create a chord progression.</div>

        <h2>Melody</h2>
        <p id="melody-output"></p>
      </section>
      <section>
        <h2>Favorites</h2>
        <div id="favorites-output"></div>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
